name: snake
on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: dahan8473/snake-and-commits@c55d1f1668e849195f395a9d93c56e74b68aaac2 # v1
        with:
          github_user: ${{ github.repository_owner }}
          output: dist/snake.svg
          theme: green
          frame: true
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
